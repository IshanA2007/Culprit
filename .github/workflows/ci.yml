# Mirrors theCourseForum2's CI shape (astral-sh/setup-uv@v5, py3.12, uv sync --frozen).
# The test job runs against a Postgres 17 service (the service is Postgres-backed);
# secret/network-gated tests (Sentry/GitHub/Discord/Anthropic + the live fork reads)
# skip cleanly in CI, which has none of those — the M1 convention.
name: Continuous Integration

on:
  pull_request:
    branches:
      - "*"
  push:
    branches: [main]

env:
  PYTHON_TARGET: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector/pgvector:pg17 — drop-in for postgres:17 with the `vector`
        # extension (plan decision 13). CI stays secretless-green.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: culprit
          POSTGRES_PASSWORD: culprit
          POSTGRES_DB: culprit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U culprit -d culprit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://culprit:culprit@localhost:5432/culprit
      CULPRIT_TEST_ADMIN_URL: postgresql+asyncpg://culprit:culprit@localhost:5432/postgres
      CULPRIT_TEST_DATABASE_URL: postgresql+asyncpg://culprit:culprit@localhost:5432/culprit_test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_TARGET }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Migrate (validate the Alembic baseline)
        run: uv run culprit migrate

      - name: Pytest
        run: uv run pytest
